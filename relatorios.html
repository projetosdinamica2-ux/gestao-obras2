<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relatórios</title><link rel="icon" type="image/png" href="assets/logo-icone.png"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/relatorio.css"></head>
<body><main><div class="rapp"><aside class="cfg">
<h3>Configurar relatório</h3>
<h4>O que incluir</h4>
<label><input type="checkbox" id="o-dash" checked> Dashboard (indicadores e gráficos por tipo de etapa)</label>
<label><input type="checkbox" id="o-det" checked> Detalhamento das obras (tabela de etapas)</label>
<label><input type="checkbox" id="o-obs" checked> Mostrar observações das etapas</label>
<label><input type="checkbox" id="o-pad" checked> Padronizar nomes (Iniciais Maiúsculas)</label>
<h4>Fase das etapas nos gráficos por tipo</h4>
<select id="o-fase"><option>Execução</option><option>Materiais</option><option>Projeto</option><option>Todas</option></select>
<h4>Obras no relatório</h4>
<input type="search" id="o-q" placeholder="Buscar obra ou cliente"><select id="o-sit"></select>
<div class="lst" id="lst"></div>
<div class="row"><button class="btn s" id="b-todas">Marcar visíveis</button><button class="btn s" id="b-nenhuma">Limpar visíveis</button></div>
<div class="cnt" id="cnt"></div>
<div class="row"><button class="btn w" id="b-pdf">Imprimir / Salvar PDF</button><button class="btn w s" id="b-xls">Exportar Excel</button></div>
<p class="cnt" style="margin-top:8px">Para PDF: clique em Imprimir, escolha “Salvar como PDF”, margens “Nenhuma” e marque “Gráficos de fundo”.</p></aside><div id="pv"></div></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/app.js"></script><script src="js/relatorios.js"></script>
</body></html>
