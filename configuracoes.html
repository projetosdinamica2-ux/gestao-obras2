<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configurações</title><link rel="icon" type="image/png" href="assets/logo-icone.png"><link rel="stylesheet" href="css/style.css"></head>
<body><main>
  <div class="card" style="max-width:460px"><h3>Alterar senha de acesso</h3>
    <p class="mut">A nova senha vale para todos os computadores. Os outros acessos abertos serão encerrados.</p>
    <label>Senha atual</label><input type="password" id="a" autocomplete="current-password"><p></p>
    <label>Nova senha (mínimo 6 caracteres)</label><input type="password" id="n" autocomplete="new-password"><p></p>
    <label>Repetir nova senha</label><input type="password" id="r" autocomplete="new-password"><p></p>
    <button class="btn" id="go">Alterar senha</button></div>
</main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/app.js"></script>
<script>
if (montarPagina('configuracoes.html', 'Configurações')) $('#go').onclick = async () => {
  const a = $('#a').value, n = $('#n').value;
  if (n.length < 6) return toast('A nova senha precisa ter ao menos 6 caracteres.', 'erro');
  if (n !== $('#r').value) return toast('As senhas digitadas não são iguais.', 'erro');
  try { if (await Api.trocarSenha(a, n)) { toast('Senha alterada com sucesso.', 'ok'); ['a', 'n', 'r'].forEach((i) => ($('#' + i).value = '')); } else toast('Senha atual incorreta.', 'erro'); } catch (e) { erro(e); }
};
</script></body></html>
